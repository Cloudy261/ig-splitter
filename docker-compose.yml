# ============================================================
#  IG Splitter: cut wide photos into seamless Instagram carousel tiles
#
#  Setup: see README.md ("Run with Docker").
#    cp .env.example .env    # then fill it in
#    docker compose up -d --build
#
#  All settings come from .env next to this file.
# ============================================================

name: ig-splitter

services:
  ig-splitter:
    build: .
    image: ig-splitter:local
    container_name: ig-splitter
    restart: unless-stopped
    ports:
      # Set IG_SPLITTER_BIND to one IP of the server (e.g. its LAN IP) to listen on that address only.
      - "${IG_SPLITTER_BIND:-0.0.0.0}:${IG_SPLITTER_PORT:-8765}:8765"
    volumes:
      - ${IG_SPLITTER_DATA:-./data}/input:/data/input
      - ${IG_SPLITTER_DATA:-./data}/output:/data/output
    environment:
      # Host names / IPs the UI may be opened with; the app rejects any other (DNS rebinding).
      IG_SPLITTER_HOSTS: "${IG_SPLITTER_HOSTS:-}"
      # Login: "on" needs IG_SPLITTER_PASSWORD_HASH (create it with --hash-password), "off" has no password.
      IG_SPLITTER_LOGIN: "${IG_SPLITTER_LOGIN:-on}"
      IG_SPLITTER_PASSWORD_HASH: "${IG_SPLITTER_PASSWORD_HASH:-}"
    # Hardening: no capabilities, read-only root file system, resource limits, rotated logs.
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m
    pids_limit: 128
    mem_limit: 2g
    cpus: 2.0
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
